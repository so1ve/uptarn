name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    name: GitHub Release
    uses: so1ve/workflows/.github/workflows/release.yml@v1
    permissions:
      contents: write
      id-token: write
    with:
      publish: false
      working-directory: server

  agent-binary:
    name: Release Agent Binary (${{ matrix.target }})
    needs: release
    permissions:
      contents: write
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - system: aarch64-linux
            arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: accept-flake-config = true
      - uses: so1ve/firn@v1
        with:
          server: https://cache.so1ve.dev
      - name: Build static agent
        run: |
          out="$(nix build ".#packages.${{ matrix.system }}.uptarn-agent-static" --print-build-logs --print-out-paths)"
          printf '%s\n' "$out" >> "$FIRN_PATHS_FILE"
          asset="uptarn-agent-${{ matrix.target }}"
          install -m 0755 "$out/bin/uptarn-agent" "$asset"
          sha256sum "$asset" > "$asset.sha256"
          mkdir -p dist
          install -m 0755 "$asset" "dist/uptarn-agent-${{ matrix.arch }}"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "uptarn-agent-${{ matrix.target }}" "uptarn-agent-${{ matrix.target }}.sha256" --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: agent-binary-${{ matrix.arch }}
          path: dist/uptarn-agent-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  server-image:
    name: Publish Server Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  agent-image:
    name: Publish Agent Image
    needs: agent-binary
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: agent-binary-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-agent
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
